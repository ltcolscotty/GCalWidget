name: UniRegexService Tests

on:
  push:
    branches: ["main"]
    paths:
      - "src/GCaLink/GCaLink/Services/UniRegexService.cs"
      - "modtests/UniRegexService.Tests/**"
  pull_request:
    branches: ["main"]
    paths:
      - "src/GCaLink/GCaLink/Services/UniRegexService.cs"
      - "modtests/UniRegexService.Tests/**"

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run UniRegexService Tests
        run: dotnet test ./modtests/UniRegexService.Tests/UniRegexService.Tests.csproj