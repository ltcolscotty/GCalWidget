name: Verify Build

on:
  push:
    branches: ["main"]
    paths:
      - "src/MosaiCal/**"
  pull_request:
    branches: ["main"]
    paths:
      - "src/MosaiCal/**"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ./src/MosaiCal/MosaiCal.sln

      - name: Build
        run: dotnet build ./src/MosaiCal/MosaiCal.sln --no-restore --configuration Debug -p:AppxPackageSigningEnabled=false